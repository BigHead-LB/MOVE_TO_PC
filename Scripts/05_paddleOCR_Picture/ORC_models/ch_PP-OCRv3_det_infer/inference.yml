# 1. 这一行必须置顶且不缩进，值必须是这个，不能写 'det'
model_name: "PP-LCNet_x1_0_doc_ori"

# 2. 移除下面 Model 块里的 model_name，保持结构纯净
Model:
  model_filename: "inference.pdmodel"
  params_filename: "inference.pdiparams"

PreProcess:
  transform_ops:
  - DetResize:
      limit_side_len: 960
      limit_type: max
  - NormalizeImage:
      scale: 1./255.
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      order: hwc
  - ToCHWImage: